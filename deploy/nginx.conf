# Le port 80 de l'hote est occupe par le leurre HTTP : le tableau de bord ecoute
# sur un port distinct, ce qui a l'avantage secondaire de le rendre moins visible
# d'un balayage.
server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/shield/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shield/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:;" always;
    add_header Referrer-Policy "no-referrer" always;

    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/v1/auth/login {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://collector:8000;
    }

    # L'ingestion n'est JAMAIS exposee : elle vit sur le reseau Docker interne.
    location /api/v1/ingest { return 404; }

    location /api/ {
        proxy_pass http://collector:8000;
        proxy_set_header Host $host;
    }

    location /ws/ {
        proxy_pass http://collector:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
