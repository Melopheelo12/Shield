# =============================================================================
# SHIELD — relais d'entree des leurres (ADR 008)
#
# Seul conteneur expose a Internet sur les ports des leurres. Il ne fait que
# relayer des octets : aucun module http, aucun contenu interprete. Les leurres
# restent sur des reseaux `internal` ; l'adresse reelle de l'attaquant leur est
# transmise en tete de chaque connexion par l'en-tete PROXY protocol v1.
#
# Exception unique au « relais d'octets » : le leurre HTTPS. Le TLS est termine
# ici, avec le certificat du domaine (volume certs), puis le flux en clair est
# relaye au leurre HTTP comme les autres. Le leurre n'execute toujours rien.
# =============================================================================

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

stream {
    proxy_protocol on;
    # Un client qui envoie sa tentative puis ferme son cote ecriture (`nc < fichier`,
    # nombre de scripts de force brute) doit encore recevoir la reponse du leurre.
    # Sans cette ligne, nginx coupe aussi le leurre : pas de reponse, et en SSH et en
    # FTP pas d'evenement du tout — l'invariant 1 serait casse.
    proxy_half_close on;
    proxy_connect_timeout 5s;
    # Au-dela de la duree maximale d'une connexion cote leurre (3 x 10 s).
    proxy_timeout 40s;

    server { listen 2222; proxy_pass decoy-ssh:2222; }
    server { listen 8080; proxy_pass decoy-http:8080; }
    server { listen 2121; proxy_pass decoy-ftp:2121; }

    # Leurre HTTPS : port 443 de l'hote. Les journaux Certificate Transparency
    # annoncent le domaine aux scanners des l'emission du certificat.
    server {
        listen 4443 ssl;
        ssl_certificate     /etc/letsencrypt/live/shield/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/shield/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_handshake_timeout 10s;
        proxy_pass decoy-http:8080;
    }
}
