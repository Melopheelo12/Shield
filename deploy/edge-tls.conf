# =============================================================================
# SHIELD — relais d'entree du leurre HTTPS (ADR 008, « un relais par rayon d'impact »)
#
# Termine le TLS avec le certificat du domaine, puis relaie le flux en clair au leurre
# HTTP avec l'en-tete PROXY protocol v1, comme `edge` pour les autres ports. Il est
# separe de `edge` pour qu'un certificat absent ou expire ne coupe que ce leurre :
# sans certificat, nginx refuse de demarrer, mais SSH, HTTP et FTP restent servis.
# Aucun module http, aucun contenu interprete : le leurre n'execute toujours rien.
# =============================================================================

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

stream {
    proxy_protocol on;
    proxy_half_close on;
    proxy_connect_timeout 5s;
    proxy_timeout 40s;

    # Port 443 de l'hote. Les journaux Certificate Transparency annoncent le domaine
    # aux scanners des l'emission du certificat.
    server {
        listen 4443 ssl;
        ssl_certificate     /etc/letsencrypt/live/shield/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/shield/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_handshake_timeout 10s;
        proxy_pass decoy-http:8080;
    }
}
