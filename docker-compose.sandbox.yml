# =============================================================================
# SHIELD — environnement SANDBOX (entrainement attaque / defense)
#
#   ./scripts/sandbox.sh start
#
# Garde-fous, dans cet ordre :
#   1. le script refuse de demarrer si SHIELD_ENV=prod
#   2. sandbox_net est "internal" : aucune route vers Internet ni vers la prod
#   3. la base de donnees est distincte de celle de production (US-38)
#
# Le conteneur "attacker" contient des outils d'audit standard. Ils ne visent
# QUE les leurres de cette sandbox, c'est-a-dire nos propres systemes, sur un
# reseau sans aucune sortie.
# =============================================================================

name: shield-sandbox

services:
  sandbox-collector:
    build:
      context: .
      dockerfile: deploy/Dockerfile.collector
    environment:
      SHIELD_ENV: sandbox
      INGEST_TOKEN: sandbox-token
      DATABASE_URL: postgresql+asyncpg://shield:sandbox@sandbox-postgres:5432/shield_sandbox
      REDIS_URL: redis://sandbox-redis:6379/0
      SANDBOX_RUN: "true"
    volumes: ["./rules:/app/rules:ro"]
    networks: [sandbox_net]
    # Le collecteur exige le schéma au démarrage (#51) : il attend la base.
    depends_on:
      sandbox-postgres: { condition: service_healthy }
      sandbox-redis: { condition: service_started }

  sandbox-decoy-ssh:
    build:
      context: .
      dockerfile: deploy/Dockerfile.decoy
    command: ["python", "-m", "shield.decoys.runner", "ssh", "--port", "2222"]
    environment:
      COLLECTOR_INGEST_URL: http://sandbox-collector:8000/api/v1/ingest
      INGEST_TOKEN: sandbox-token
    read_only: true
    cap_drop: [ALL]
    networks: [sandbox_net]
    depends_on: [sandbox-collector]

  sandbox-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shield
      POSTGRES_PASSWORD: sandbox
      POSTGRES_DB: shield_sandbox
    # Même schéma que la production, appliqué à la création du volume.
    volumes: ["./deploy/initdb:/docker-entrypoint-initdb.d:ro"]
    networks: [sandbox_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shield -d shield_sandbox"]
      interval: 2s
      timeout: 3s
      retries: 30

  sandbox-redis:
    image: redis:7-alpine
    networks: [sandbox_net]

  attacker:
    image: alpine:3.20
    command: ["sleep", "infinity"]
    networks: [sandbox_net]
    # Outils installes a la demande dans le conteneur, jamais dans l'image du depot.

networks:
  sandbox_net:
    internal: true      # LE garde-fou structurel de la sandbox
