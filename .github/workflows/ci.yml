name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- 1. Lint & types
  lint:
    name: Lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check src tests
      - name: black
        run: black --check src tests
      - name: mypy
        run: mypy src --ignore-missing-imports
        continue-on-error: true   # bloquant a partir du sprint 2

  # ------------------------------------------------------------ 2. Tests unitaires
  unit:
    name: Tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - name: pytest
        run: pytest tests/unit --cov=shield --cov-report=term-missing --cov-report=xml
      - name: Seuil de couverture sur les zones critiques
        run: |
          pytest tests/unit \
            --cov=shield.common.schema \
            --cov=shield.collector.defender \
            --cov=shield.collector.ingest \
            --cov=shield.collector.enrichment \
            --cov-fail-under=80
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: coverage, path: coverage.xml }

  # --------------------------------------------------- 3. Contrat front / back
  contract:
    name: Contrat d'evenement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Les types TypeScript sont-ils a jour ?
        run: python -m shield.tools.gen_ts_types --check

  # ----------------------------------------------------- 4. Tests d'integration
  integration:
    name: Tests d'integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shield
          POSTGRES_PASSWORD: shield
          POSTGRES_DB: shield_test
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - name: pytest integration
        env:
          DATABASE_URL: postgresql+asyncpg://shield:shield@localhost:5432/shield_test
          REDIS_URL: redis://localhost:6379/0
          INGEST_TOKEN: ci-token
          SHIELD_REQUIRE_DB: "1"   # echouer, et non ignorer, si la base manque
        run: pytest tests/integration -q

  # ------------------------------------------------------------- 5. Securite
  security:
    name: Securite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - name: bandit (motifs dangereux)
        run: bandit -r src -ll
      - name: pip-audit (dependances vulnerables)
        run: pip install pip-audit && pip-audit --strict || true
      - name: gitleaks (secrets)
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  # ---------------------------------------------- 6. Charge : objectif SMART F1
  load:
    name: Charge — 3000 evenements en 60 s
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shield
          POSTGRES_PASSWORD: shield
          POSTGRES_DB: shield
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
    env:
      DATABASE_URL: postgresql+asyncpg://shield:shield@localhost:5432/shield
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Appliquer le schema (comme docker-entrypoint-initdb.d)
        env: { PGPASSWORD: shield }
        run: |
          for script in deploy/initdb/*.sql; do
            psql -h localhost -U shield -d shield -v ON_ERROR_STOP=1 -f "$script"
          done
      - name: Demarrer le collecteur
        env: { INGEST_TOKEN: ci-token }
        run: |
          uvicorn shield.collector.api.app:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/v1/health && break || sleep 1
          done
      - name: Injecter 3000 evenements a 50/s
        run: |
          python -m shield.tools.fake_events \
            --url http://127.0.0.1:8000/api/v1/ingest --token ci-token \
            --rate 50 --count 3000
      - name: Verifier qu'aucun evenement n'a ete perdu
        run: |
          COUNT=$(curl -s http://127.0.0.1:8000/api/v1/stats/overview | python -c "import json,sys;print(json.load(sys.stdin)['events'])")
          echo "evenements stockes : $COUNT / 3000"
          test "$COUNT" -eq 3000

  # ------------------------------------------------------- 7. Build des images
  build:
    name: Build des images
    runs-on: ubuntu-latest
    needs: [lint, unit, contract]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: collector
        uses: docker/build-push-action@v6
        with: { context: ., file: deploy/Dockerfile.collector, push: false }
      - name: decoy
        uses: docker/build-push-action@v6
        with: { context: ., file: deploy/Dockerfile.decoy, push: false }
