# =============================================================================
# SHIELD — Règles de détection de l'agent défenseur
#
# Chaque règle porte une description en langage clair (US-17) : elle est affichée
# telle quelle dans l'interface, à destination d'un utilisateur non expert.
#
# Champs :
#   id            identifiant stable, jamais réutilisé
#   name          nom court en kebab-case, anglais, utilisé dans le code
#   description   une à trois phrases, en français, sans jargon
#   severity      low | medium | high | critical
#   weight        points ajoutés au score de menace (le total est plafonné à 100)
#   window_seconds fenêtre du compteur utilisé, 0 si la règle ne dépend pas du temps
#   profile_hint  profil d'attaquant suggéré si cette règle se déclenche
#   condition     arbre all / any / not / comparaison
#
# Opérateurs : eq, ne, gte, lte, in, contains, is_empty
# Champs de contexte : service, source_ip, dest_port, username, password, payload,
#   country_code, asn, reputation_score, technique_id, counter.<nom>
# =============================================================================

- id: R-001
  name: known-default-credentials
  description: >
    Le couple identifiant / mot de passe testé fait partie des combinaisons par
    défaut les plus répandues. C'est la première chose qu'un robot essaie.
  severity: medium
  weight: 20
  profile_hint: force_brute_ciblee
  condition:
    all:
      - field: username
        op: in
        value: [root, admin, administrator, user, test, ubuntu, pi, oracle, postgres, ftp]
      - field: password
        op: in
        value: ["123456", "password", "admin", "root", "12345678", "qwerty", "1234", "toor", "raspberry", ""]

- id: R-002
  name: root-account-targeted
  description: >
    La tentative vise directement le compte administrateur de la machine.
    Un usage légitime passe rarement par ce compte.
  severity: medium
  weight: 15
  profile_hint: force_brute_ciblee
  condition:
    field: username
    op: in
    value: [root, administrator, admin]

- id: R-003
  name: bad-reputation-address
  description: >
    L'adresse source est déjà signalée par une base de réputation publique comme
    ayant participé à des attaques récentes.
  severity: medium
  weight: 17
  condition:
    field: reputation_score
    op: gte
    value: 50

- id: R-004
  name: very-bad-reputation-address
  description: >
    L'adresse source est massivement signalée. Elle appartient très probablement à
    un réseau de machines compromises utilisé pour des balayages automatisés.
  severity: high
  weight: 25
  profile_hint: balayage_opportuniste
  condition:
    field: reputation_score
    op: gte
    value: 85

- id: R-005
  name: silent-port-probe
  description: >
    La connexion a été ouverte puis refermée sans envoyer d'identifiant. C'est la
    signature d'un balayage de ports qui cherche seulement à savoir quels services
    répondent.
  severity: low
  weight: 8
  profile_hint: balayage_opportuniste
  condition:
    all:
      - field: username
        op: is_empty
        value: true
      - field: password
        op: is_empty
        value: true

- id: R-006
  name: multi-service-sweep
  description: >
    La même adresse a touché plusieurs de nos services leurres en quelques minutes.
    Elle cartographie la machine plutôt que de viser un service précis.
  severity: medium
  weight: 18
  window_seconds: 300
  profile_hint: balayage_opportuniste
  condition:
    field: counter.distinct_services_by_ip
    op: gte
    value: 2

- id: R-007
  name: ssh-bruteforce
  description: >
    Plus de vingt tentatives d'authentification depuis la même adresse sur le leurre
    SSH en moins de cinq minutes. C'est le signe d'un dictionnaire automatisé, pas
    d'une erreur de saisie.
  severity: high
  weight: 35
  window_seconds: 300
  profile_hint: force_brute_ciblee
  condition:
    all:
      - field: service
        op: eq
        value: ssh
      - field: counter.auth_attempts_by_ip
        op: gte
        value: 20

- id: R-008
  name: sustained-bruteforce
  description: >
    Plus de cent tentatives depuis la même adresse en cinq minutes. Le rythme est
    industriel : l'attaquant dispose d'une infrastructure dédiée.
  severity: critical
  weight: 55
  window_seconds: 300
  profile_hint: force_brute_ciblee
  condition:
    field: counter.auth_attempts_by_ip
    op: gte
    value: 100

- id: R-009
  name: path-traversal-attempt
  description: >
    La requête contient une séquence de remontée de répertoire, utilisée pour tenter
    de lire des fichiers en dehors du dossier prévu — y compris sous forme encodée,
    pour échapper aux filtres.
  severity: high
  weight: 40
  profile_hint: tentative_exploitation
  version: 2
  condition:
    any:
      - field: payload
        op: contains
        value: "../"
      - field: payload
        op: contains
        value: "..%2f"
      - field: payload
        op: contains
        value: "%2e%2e"
      - field: payload
        op: contains
        value: ".%2e/"
      - field: payload
        op: contains
        value: "%2e./"
      - field: payload
        op: contains
        value: "..%5c"
      - field: payload
        op: contains
        value: "..\\"

- id: R-010
  name: command-injection-attempt
  description: >
    La requête contient des motifs d'injection de commande système : téléchargement
    puis exécution d'un programme, appel d'un interpréteur. L'attaquant cherche à
    faire exécuter ses propres instructions par le serveur.
  severity: critical
  weight: 60
  profile_hint: tentative_exploitation
  version: 2
  condition:
    any:
      - field: payload
        op: contains
        value: ";wget"
      - field: payload
        op: contains
        value: ";curl"
      - field: payload
        op: contains
        value: "wget+http"
      - field: payload
        op: contains
        value: "wget%20http"
      - field: payload
        op: contains
        value: "curl+http"
      - field: payload
        op: contains
        value: "|sh"
      - field: payload
        op: contains
        value: "| sh"
      - field: payload
        op: contains
        value: "chmod +x"
      - field: payload
        op: contains
        value: "chmod+777"
      - field: payload
        op: contains
        value: "busybox"
      - field: payload
        op: contains
        value: "$(("
      - field: payload
        op: contains
        value: "/bin/sh"
      - field: payload
        op: contains
        value: "/bin/bash"

- id: R-011
  name: sql-injection-attempt
  description: >
    La requête contient des motifs d'injection SQL classiques, en clair ou encodés,
    visant à détourner une requête de base de données.
  severity: high
  weight: 40
  profile_hint: tentative_exploitation
  version: 2
  condition:
    any:
      - field: payload
        op: contains
        value: "' or '1'='1"
      - field: payload
        op: contains
        value: "' or 1=1"
      - field: payload
        op: contains
        value: "%27%20or%20"
      - field: payload
        op: contains
        value: "%27+or+"
      - field: payload
        op: contains
        value: "union select"
      - field: payload
        op: contains
        value: "union%20select"
      - field: payload
        op: contains
        value: "union+select"
      - field: payload
        op: contains
        value: "information_schema"
      - field: payload
        op: contains
        value: "sleep("

- id: R-012
  name: automated-client-signature
  description: >
    Le client s'annonce avec la signature d'un outil d'automatisation ou de balayage
    connu. Aucun navigateur ni client légitime ne se présente ainsi.
  severity: medium
  weight: 15
  profile_hint: balayage_opportuniste
  version: 2
  condition:
    any:
      - field: payload
        op: contains
        value: "libssh"
      - field: payload
        op: contains
        value: "zgrab"
      - field: payload
        op: contains
        value: "masscan"
      - field: payload
        op: contains
        value: "python-requests"
      - field: payload
        op: contains
        value: "nuclei"
      - field: payload
        op: contains
        value: "sqlmap"
      - field: payload
        op: contains
        value: "nikto"
      - field: payload
        op: contains
        value: "nmap scripting engine"
      - field: payload
        op: contains
        value: "gobuster"
      - field: payload
        op: contains
        value: "wpscan"
      - field: payload
        op: contains
        value: "go-http-client"

- id: R-013
  name: oversized-payload
  description: >
    La charge utile dépasse la taille que nous conservons. Un volume anormal est
    souvent une tentative de débordement de mémoire tampon.
  severity: medium
  weight: 20
  profile_hint: tentative_exploitation
  condition:
    field: payload_truncated
    op: eq
    value: true

- id: R-014
  name: repeat-offender
  description: >
    Cette adresse revient après avoir déjà été observée aujourd'hui. Elle ne fait
    pas que passer : elle insiste.
  severity: low
  weight: 10
  window_seconds: 86400
  condition:
    field: counter.events_by_ip_24h
    op: gte
    value: 50

- id: R-015
  name: known-exploit-signature
  description: >
    La requête porte la signature d'une vulnérabilité connue et activement exploitée
    (Log4Shell, Shellshock, PHPUnit, routeurs TP-Link…). Ce n'est plus de la
    reconnaissance : c'est une tentative de prise de contrôle.
  severity: critical
  weight: 60
  profile_hint: tentative_exploitation
  # Mêmes motifs que les signatures de la veille (src/shield/collector/watch.py).
  condition:
    any:
      - field: payload
        op: contains
        value: "${jndi:"
      - field: payload
        op: contains
        value: "() { :;};"
      - field: payload
        op: contains
        value: "/.%2e/"
      - field: payload
        op: contains
        value: "eval-stdin.php"
      - field: payload
        op: contains
        value: "fgt_lang"
      - field: payload
        op: contains
        value: "/mgmt/tm/util/bash"
      - field: payload
        op: contains
        value: "/vpn/../vpns/"
      - field: payload
        op: contains
        value: "/cgi-bin/luci/;stok="
      - field: payload
        op: contains
        value: "connector.minimal.php"

- id: R-016
  name: xss-attempt
  description: >
    La requête tente d'injecter un script dans une page. Sur un site réel, il
    s'exécuterait dans le navigateur des visiteurs.
  severity: high
  weight: 30
  profile_hint: tentative_exploitation
  condition:
    any:
      - field: payload
        op: contains
        value: "<script"
      - field: payload
        op: contains
        value: "%3cscript"
      - field: payload
        op: contains
        value: "javascript:"
      - field: payload
        op: contains
        value: "onerror="
      - field: payload
        op: contains
        value: "%3csvg"

- id: R-017
  name: sensitive-file-probe
  description: >
    La requête réclame un fichier qui contient d'ordinaire des secrets : mots de
    passe d'application, clés privées, historique du code source. Un seul de ces
    fichiers exposé suffit souvent à compromettre tout un serveur.
  severity: high
  weight: 30
  profile_hint: tentative_exploitation
  condition:
    any:
      - field: payload
        op: contains
        value: "/.env"
      - field: payload
        op: contains
        value: "/.git/"
      - field: payload
        op: contains
        value: "wp-config"
      - field: payload
        op: contains
        value: "id_rsa"
      - field: payload
        op: contains
        value: "/.aws/"
      - field: payload
        op: contains
        value: "/.ssh/"
      - field: payload
        op: contains
        value: "/etc/passwd"
      - field: payload
        op: contains
        value: "phpinfo"
      - field: payload
        op: contains
        value: "/backup/"

- id: R-018
  name: bruteforce-other-services
  description: >
    Plus de vingt tentatives d'authentification depuis la même adresse sur le leurre
    FTP ou sur la page d'administration en moins de cinq minutes : un dictionnaire
    automatisé, comme sur SSH.
  severity: high
  weight: 35
  window_seconds: 300
  profile_hint: force_brute_ciblee
  condition:
    all:
      - field: service
        op: in
        value: [ftp, http]
      - field: counter.auth_attempts_by_ip
        op: gte
        value: 20

- id: R-019
  name: credential-attempt-on-decoy
  description: >
    Un identifiant a été essayé sur un leurre. Aucun utilisateur légitime ne se
    connecte à un leurre : même isolée, la tentative est hostile. Seule, elle pèse
    peu ; répétée, d'autres règles prennent le relais.
  severity: low
  weight: 5
  profile_hint: force_brute_ciblee
  condition:
    any:
      - not:
          field: username
          op: is_empty
          value: true
      - not:
          field: password
          op: is_empty
          value: true

- id: R-020
  name: enumerated-bait-account
  description: >
    L'identifiant essayé n'existe que dans les pages que notre site laisse fuiter
    volontairement. L'attaquant a donc d'abord fait de la reconnaissance sur le site,
    puis s'en sert : ce n'est plus un dictionnaire aveugle, c'est une attaque ciblée.
  severity: high
  weight: 30
  profile_hint: force_brute_ciblee
  # Doit rester égal à BAIT_USER (src/shield/decoys/site.py).
  condition:
    field: username
    op: eq
    value: atelier

- id: R-021
  name: trap-password-reused
  description: >
    Le mot de passe essayé n'existe que dans la fausse copie de configuration que
    notre site laisse traîner. L'attaquant a exploré le site, lu ce fichier, puis
    essayé le mot de passe qu'il y a trouvé : il réutilise un secret volé, ce
    qu'aucun dictionnaire ne ferait.
  severity: critical
  weight: 60
  profile_hint: force_brute_ciblee
  # Doit rester égal à TRAP_PASSWORD (src/shield/decoys/site.py).
  condition:
    field: password
    op: eq
    value: "Copeaux.Chene4817"
